name: ChattyChattyGoGo
packages:
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.1.0
options:
  bundleIdPrefix: pt.com.desousa.filipe
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N9Q487K8WW
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  ChattyChattyGoGo:
    type: application
    platform: iOS
    dependencies:
      - package: HighlightSwift
    sources:
      - path: ChattyChattyGoGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGo
        PRODUCT_NAME: ChattyChattyGoGo
        INFOPLIST_KEY_CFBundleDisplayName: "ChattyChatty GoGo"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID keeps your private conversations locked when you leave the app."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  ChattyChattyGoGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChattyChattyGoGoTests
    dependencies:
      - target: ChattyChattyGoGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGoTests
        GENERATE_INFOPLIST_FILE: YES

  ChattyChattyGoGoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChattyChattyGoGoUITests
    dependencies:
      - target: ChattyChattyGoGo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.com.desousa.filipe.ChattyChattyGoGoUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ChattyChattyGoGo

schemes:
  ChattyChattyGoGo:
    build:
      targets:
        ChattyChattyGoGo: all
        ChattyChattyGoGoTests: [test]
        ChattyChattyGoGoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChattyChattyGoGoTests
        - ChattyChattyGoGoUITests
